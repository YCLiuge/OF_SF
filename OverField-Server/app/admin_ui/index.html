<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OF_SF · 区服管理台</title><link rel="stylesheet" href="/admin/console.css">
<script type="module" src="/admin/console.js"></script>
</head><body>
<header class="top"><strong>OF<span>_</span>SF</strong><span class="divider"></span>区服管理台<button id="logout" class="quiet" hidden>断开连接</button></header>
<main>
<section id="connect"><form id="login"><h1>连接管理台</h1><label for="token">服主令牌</label>
<input id="token" type="password" autocomplete="off" spellcheck="false" required><button>连接区服</button></form></section>
<section id="workspace" hidden>
<aside><h2>区服管理</h2><button id="home" class="home-link" type="button">运行总览</button><label class="sr" for="filter">查找管理操作</label><input id="filter" type="search" placeholder="查找管理操作"><nav id="operations" aria-label="管理操作"></nav></aside>
<div class="desk"><realm-overview></realm-overview><section id="shortcuts"><h2>常用操作</h2><div id="quick" role="navigation" aria-label="常用操作"></div></section>
<article hidden><header><div><h1 id="title"></h1></div><span id="mode"></span></header>
<p id="description"></p><form id="operation"><div id="fields"></div><button id="execute"></button></form>
<details class="interface-details"><summary>接口详情</summary><code id="route"></code><pre id="schema"></pre></details>
<section id="output" hidden><h2>执行结果</h2><div id="result" tabindex="-1"></div></section>
</article></div></section>
<p id="status" role="status" aria-live="polite"></p></main>
</body></html>
