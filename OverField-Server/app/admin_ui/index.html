<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OF_SF · 区服管理台</title><link rel="stylesheet" href="/admin/console.css">
<script type="module" src="/admin/console.js"></script>
</head><body>
<header class="top"><strong>OF<span>_</span>SF</strong><span class="divider"></span>区服管理台<button id="logout" class="quiet" hidden>断开连接</button></header>
<main>
<section id="connect"><form id="login"><h1>连接管理台</h1><label for="token">服主令牌</label>
<input id="token" type="password" autocomplete="off" spellcheck="false" required><button>连接区服</button></form></section>
<section id="workspace" hidden>
<aside><h2>管理操作</h2><label class="sr" for="filter">搜索名称或接口</label><input id="filter" type="search" placeholder="搜索名称或接口"><nav id="operations" aria-label="管理操作"></nav></aside>
<div class="desk"><realm-overview></realm-overview>
<article><header><div><code id="route"></code><h1 id="title"></h1></div><span id="mode"></span></header>
<p id="description"></p><form id="operation"><div id="fields"></div><button id="execute"></button></form>
<details><summary>接口与输入格式</summary><pre id="schema"></pre></details>
<section id="output" hidden><h2>执行结果</h2><pre id="result" tabindex="0"></pre></section>
</article></div></section>
<p id="status" role="status" aria-live="polite"></p></main>
</body></html>
